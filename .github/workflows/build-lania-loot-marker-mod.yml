name: Build lania-loot-marker mod

on:
  push:
    branches: [main]
    paths:
      - 'mods/lania-loot-marker/**'
      - '.github/workflows/build-lania-loot-marker-mod.yml'
  pull_request:
    paths:
      - 'mods/lania-loot-marker/**'
      - '.github/workflows/build-lania-loot-marker-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mods/lania-loot-marker
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: bash ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: lania-loot-marker
          path: |
            mods/lania-loot-marker/build/libs/*.jar
            !mods/lania-loot-marker/**/*-sources.jar
            !mods/lania-loot-marker/**/*-javadoc.jar
            !mods/lania-loot-marker/**/*-dev.jar
            !mods/lania-loot-marker/**/original-*.jar
          if-no-files-found: error
          retention-days: 14
