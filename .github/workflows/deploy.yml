name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      api: ${{ steps.filter.outputs.api }}
      front: ${{ steps.filter.outputs.front }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - '.github/workflows/**'
              - 'apps/admin/**'
              - 'apps/api/**'
            api:
              - '.github/workflows/**'
              - 'apps/api/**'
            front:
              - '.github/workflows/**'
              - 'apps/front/**'
            shell:
              - '.github/workflows/**'
              - 'apps/shell/**'

  build-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12
        env:
          MARIADB_ROOT_PASSWORD: admin-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test admin service
        working-directory: apps/api
        env:
          ADMIN_TEST_DSN: root:admin-test-password@tcp(127.0.0.1:3306)/
          CGO_ENABLED: '1'
        run: go test -race ./internal/admin ./cmd/admin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ghcr.io/keelfy/lania:latest-admin
            ghcr.io/keelfy/lania:admin-${{ github.sha }}

  build-backend:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/keelfy/lania:latest-backend
            ghcr.io/keelfy/lania:backend-${{ github.sha }}

  build-shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/shell
          push: true
          tags: |
            ghcr.io/keelfy/lania:latest-shell
            ghcr.io/keelfy/lania:shell-${{ github.sha }}

  build-frontend:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/front
          push: true
          build-args: |
            NEXT_PUBLIC_PREREGISTRATION=${{ vars.NEXT_PUBLIC_PREREGISTRATION }}
            NEXT_PUBLIC_ACTIVE_SEASON_ID=${{ vars.NEXT_PUBLIC_ACTIVE_SEASON_ID }}
            NEXT_PUBLIC_DOMAIN=https://www.lania.network
            NEXT_PUBLIC_IMGPROXY_ENDPOINT=https://images.lania.network
            NEXT_PUBLIC_BACKEND_URL=https://api.lania.network
            NEXT_PUBLIC_ORY_SDK_URL=https://accounts.lania.network
            NEXT_PUBLIC_SUPPORT_EMAIL=contact@lania.network
            NEXT_PUBLIC_SUPPORT_URL=/support
            NEXT_PUBLIC_TELEGRAM_CHANNEL_URL=https://t.me/laniamc
            NEXT_PUBLIC_DISCORD_SERVER_URL=https://discord.gg/laniamc
          tags: |
            ghcr.io/keelfy/lania:latest-frontend
            ghcr.io/keelfy/lania:frontend-${{ github.sha }}

  deploy:
    needs: [changes, build-admin, build-backend, build-shell, build-frontend]
    if: |
      always() &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-shell.result == 'success' || needs.build-shell.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.changes.outputs.admin == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.front == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/lania-web/compose
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
