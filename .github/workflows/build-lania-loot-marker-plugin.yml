name: Build LaniaLootMarker

on:
  push:
    branches: [main]
    paths:
      - 'plugins/LaniaLootMarker/**'
      - '.github/workflows/build-lania-loot-marker-plugin.yml'
  pull_request:
    paths:
      - 'plugins/LaniaLootMarker/**'
      - '.github/workflows/build-lania-loot-marker-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/LaniaLootMarker
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: bash ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: LaniaLootMarker
          path: |
            plugins/LaniaLootMarker/build/libs/*.jar
            !plugins/LaniaLootMarker/**/*-sources.jar
            !plugins/LaniaLootMarker/**/*-javadoc.jar
            !plugins/LaniaLootMarker/**/*-dev.jar
            !plugins/LaniaLootMarker/**/original-*.jar
          if-no-files-found: error
          retention-days: 14
