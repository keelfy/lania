[tools]
go = "1.27"
bun = "latest"

[env]
_.file = ".env.json"
AWS_ACCESS_KEY_ID = { required = true }
AWS_SECRET_ACCESS_KEY = { required = true }

[tasks.api-install-tools]
description = "Install Go developer tools"
dir = "apps/api"
run = [
  "go install github.com/rubenv/sql-migrate/...@latest",
  "go install github.com/google/wire/cmd/wire@latest",
  "go install github.com/swaggo/swag/cmd/swag@latest",
  "go install github.com/bufbuild/buf/cmd/buf@latest",
  "go install google.golang.org/protobuf/cmd/protoc-gen-go@latest",
  "go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest",
]

[tasks.api-deps]
description = "Download API dependencies"
dir = "apps/api"
run = "go mod download"

[tasks.api-add-migration]
description = "Create SQL migration file (usage: mise run api-add-migration -- name=init_users)"
dir = "apps/api"
run = "migrate create -ext sql -dir ./db/migration \"$name\""

[tasks.api-migrate-up]
description = "Run API migrations up (requires DATABASE_URL)"
dir = "apps/api"
run = "migrate -database \"$DATABASE_URL\" -path ./db/migration up"

[tasks.api-migrate-down]
description = "Run API migrations down (requires DATABASE_URL)"
dir = "apps/api"
run = "migrate -database \"$DATABASE_URL\" -path ./db/migration down"

[tasks.api-generate]
description = "Generate wire + swagger artifacts"
dir = "apps/api"
run = "wire ./cmd && swag init -g ./cmd/main.go --parseDependency --parseInternal"

[tasks.api-build]
description = "Build API binary"
dir = "apps/api"
run = "mkdir -p artifacts && rm -rf artifacts/* && GOOS=${GOOS:-$(go env GOOS)} GOARCH=${GOARCH:-$(go env GOARCH)} CGO_ENABLED=${CGO_ENABLED:-0} go build -ldflags='-s' -o ./artifacts/bin ./cmd"

[tasks.api-run]
description = "Run API"
dir = "apps/api"
run = "go run ./cmd"

[tasks.api-test]
description = "Run API tests"
dir = "apps/api"
run = "go test -v ./..."

[tasks.proto-generate]
description = "Lint proto contracts and generate Go code for shell and API"
dir = "proto"
run = [
  "buf lint",
  "buf generate --template buf.gen.shell.yaml",
  "buf generate --template buf.gen.api.yaml",
]

[tasks.shell-generate]
description = "Generate shell wire artifacts"
dir = "apps/shell"
run = "wire ./cmd"

[tasks.shell-run]
description = "Run shell"
dir = "apps/shell"
run = "go run ./cmd"

[tasks.shell-test]
description = "Run shell tests"
dir = "apps/shell"
run = "go test -v ./..."

[tasks.shell-build]
description = "Build shell binary"
dir = "apps/shell"
run = "mkdir -p artifacts && rm -rf artifacts/* && GOOS=${GOOS:-$(go env GOOS)} GOARCH=${GOARCH:-$(go env GOARCH)} CGO_ENABLED=${CGO_ENABLED:-0} go build -ldflags='-s' -o ./artifacts/bin ./cmd"

[tasks.front-install]
description = "Install frontend dependencies with Bun"
dir = "apps/front"
run = "bun install"

[tasks.front-dev]
description = "Run frontend development server"
dir = "apps/front"
run = "bun run dev"

[tasks.front-build]
description = "Build frontend with Bun"
dir = "apps/front"
run = "bun run build"

[tasks.front-lint]
description = "Lint frontend with Bun"
dir = "apps/front"
run = "bun run lint"

[tasks.spinoff-terraform-prod-init]
description = "Initialize Terraform"
dir = "infra/spinoff/terraform/environments/prod"
run = "terraform init"

[tasks.spinoff-terraform-prod-plan]
description = "Plan Terraform"
dir = "infra/spinoff/terraform/environments/prod"
run = "terraform plan"

[tasks.spinoff-terraform-prod-apply]
description = "Apply Terraform"
dir = "infra/spinoff/terraform/environments/prod"
run = "terraform apply"

[tasks.web-terraform-prod-init]
description = "Initialize Terraform"
dir = "infra/web/terraform/environments/prod"
run = "terraform init"

[tasks.web-terraform-prod-plan]
description = "Plan Terraform"
dir = "infra/web/terraform/environments/prod"
run = "terraform plan"

[tasks.web-terraform-prod-apply]
description = "Apply Terraform"
dir = "infra/web/terraform/environments/prod"
run = "terraform apply"

[tasks.edge-terraform-prod-init]
description = "Initialize Terraform"
dir = "infra/edge/terraform/environments/prod"
run = "terraform init"

[tasks.edge-terraform-prod-plan]
description = "Plan Terraform"
dir = "infra/edge/terraform/environments/prod"
run = "terraform plan"

[tasks.edge-terraform-prod-apply]
description = "Apply Terraform"
dir = "infra/edge/terraform/environments/prod"
run = "terraform apply"
