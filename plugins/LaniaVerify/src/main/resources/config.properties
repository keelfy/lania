# LaniaVerify: shows the license verification code of lania.network on the kick screen.

# false turns the plugin off, every login goes on as usual.
enabled=true
# Base URL of the Lania API, without the trailing slash.
apiUrl=https://api.lania.network
# Must equal API_KEY of the API.
apiKey=CHANGEME
# How long a login waits for the API. A slower or failed answer lets the player in as usual.
timeoutMs=1500
# Kick screen, MiniMessage format. {code} is replaced with the code.
message=<gold>Код подтверждения: <white><bold>{code}</bold></white></gold><newline><newline><gray>Введите его на сайте lania.network в течение 10 минут, затем заходите снова.</gray>
