version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/lania-smp/shell/internal/gen
plugins:
  - local: protoc-gen-go
    out: ../apps/shell/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../apps/shell/internal/gen
    opt: paths=source_relative
