syntax = "proto3";

package lania.shell.v1;

// PermissionService manages player groups and chat decorations.
service PermissionService {
  // GetPlayerGroups returns the permission groups assigned to each player.
  rpc GetPlayerGroups(GetPlayerGroupsRequest) returns (GetPlayerGroupsResponse);
  // ListPlayersByGroups returns players that belong to at least one of the groups.
  rpc ListPlayersByGroups(ListPlayersByGroupsRequest) returns (ListPlayersByGroupsResponse);
  // SetPlayerPrefix replaces the player's chat prefix. Idempotent.
  rpc SetPlayerPrefix(SetPlayerPrefixRequest) returns (SetPlayerPrefixResponse);
  // SetPlayerRoles makes every listed player belong to exactly the given role group. Idempotent.
  rpc SetPlayerRoles(SetPlayerRolesRequest) returns (SetPlayerRolesResponse);
  // RegisterPlayer makes LuckPerms know the player by username before the first join. Idempotent.
  rpc RegisterPlayer(RegisterPlayerRequest) returns (RegisterPlayerResponse);
}

message GetPlayerGroupsRequest {
  repeated string minecraft_uuids = 1;
}

message GetPlayerGroupsResponse {
  // Keyed by Minecraft UUID. Players without groups map to an empty list.
  map<string, PlayerGroups> groups = 1;
}

message PlayerGroups {
  repeated string names = 1;
}

message ListPlayersByGroupsRequest {
  repeated string groups = 1;
}

message ListPlayersByGroupsResponse {
  // Minecraft UUIDs in canonical string form.
  repeated string minecraft_uuids = 1;
}

message SetPlayerPrefixRequest {
  string minecraft_uuid = 1;
  // Fully formatted prefix, MiniMessage allowed.
  string prefix = 2;
}

message SetPlayerPrefixResponse {}

message SetPlayerRolesRequest {
  // Every group that stands for a role. A listed player leaves all of them before joining the given one.
  repeated string role_groups = 1;
  // Role group per player, keyed by Minecraft UUID. An empty group leaves the player in no role group.
  map<string, string> roles = 2;
}

message SetPlayerRolesResponse {}

message RegisterPlayerRequest {
  string minecraft_uuid = 1;
  string username = 2;
}

message RegisterPlayerResponse {}
