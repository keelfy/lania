services:
  lania-redis:
    image: redis:6
    container_name: lania-redis
    ports:
      - "6379:6379"
    volumes:
      - lania-redis-data:/data
    restart: always

  lania-mariadb:
    image: mariadb:12
    container_name: lania-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DB}
    ports:
      - "3306:3306"
    volumes:
      - lania-mariadb-data:/var/lib/mysql
    restart: always

  lania-postgres:
    image: postgres:16
    container_name: lania-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - lania-postgres-data:/var/lib/postgresql/data
    restart: always

  lania-kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: lania-kratos-migrate
    environment:
      - DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@lania-postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - lania-postgres
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure

  lania-kratos:
    depends_on:
      - lania-kratos-migrate
    image: oryd/kratos:v1.3.1
    container_name: lania-kratos
    ports:
      - "4433:4433" # public
      - "4434:4434" # admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@lania-postgres:5432/${POSTGRES_DB}?sslmode=disable
      - LOG_LEVEL=debug
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos

  lania-mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: lania-mailslurper
    ports:
      - "4436:4436"
      - "4437:4437"

volumes:
  lania-redis-data:
  lania-mariadb-data:
  lania-postgres-data: